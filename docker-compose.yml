version: '3.8'

services:
  alloydb-omni:
    image: google/alloydbomni:15
    container_name: procureiq-alloydb-local
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=procureiq
    volumes:
      - alloydb_data:/var/lib/postgresql/data
      - ./deploy/alloydb/local/initdb.d:/docker-entrypoint-initdb.d
    restart: always

  tempo:
    image: grafana/tempo:latest
    container_name: procureiq-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: procureiq-grafana
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3001:3000"
    depends_on:
      - tempo
    restart: always

  springboot-app:
    build: ./packages/java/procureiq-springboot
    container_name: procureiq-springboot-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://alloydb-omni:5432/procureiq
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - OTEL_SERVICE_NAME=springboot-app
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      - alloydb-omni
      - tempo
    restart: always

  python-app:
    build: ./packages/python/procureiq-python
    container_name: procureiq-python-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@alloydb-omni:5432/procureiq
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    depends_on:
      - alloydb-omni
      - tempo
    restart: always

  nextjs-app:
    build: ./packages/node/procureiq-nextjs
    container_name: procureiq-nextjs-app
    ports:
      - "8990:8990"
      - "8991:8991"
      - "8992:8992"
      - "8993:8993"
      - "8994:8994"
      - "8995:8995"
      - "8996:8996"
      - "8997:8997"
      - "8998:8998"
    environment:
      - NEXT_PUBLIC_API_URL=http://springboot-app:8080/api/v1
      - NEXT_PUBLIC_PYTHON_API_URL=http://python-app:8000
      - NEXT_PUBLIC_WEBRTC_SIGNALING_URL=ws://webrtc-server:8082
      - DATABASE_URL=postgresql://postgres:postgres@alloydb-omni:5432/procureiq
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
    depends_on:
      - alloydb-omni
      - tempo
    restart: always

  webrtc-server:
    build: ./packages/node/procureiq-webrtc
    container_name: procureiq-webrtc-server
    ports:
      - "8082:8082"
    restart: always

  api-gateway:
    image: nginx:alpine
    container_name: procureiq-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - springboot-app
      - python-app
      - nextjs-app
    restart: always

volumes:
  alloydb_data:
    driver: local
