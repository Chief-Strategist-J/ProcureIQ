services:
  alloydb-omni:
    image: google/alloydbomni:15
    container_name: procureiq-alloydb-local
    ports:
      - "${ALLOYDB_PORT}:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - alloydb_data:/var/lib/postgresql/data
    restart: always

  tempo:
    image: grafana/tempo:latest
    container_name: procureiq-tempo
    command: [ "-config.file=${TEMPO_CONFIG_FILE}" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "${TEMPO_QUERY_PORT}:3200"
      - "${TEMPO_GRPC_PORT}:4317"
      - "${TEMPO_HTTP_PORT}:4318"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: procureiq-grafana
    volumes:
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/tempo.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE}
      - GF_AUTH_DISABLE_LOGIN_FORM=${GF_AUTH_DISABLE_LOGIN_FORM}
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_INTERNAL_PORT}"
    depends_on:
      - tempo
    restart: always

  springboot-app:
    build:
      context: ../../java/procureiq-springboot
      dockerfile: ../../deployment/docker/Dockerfile.springboot
    container_name: procureiq-springboot-app
    environment:
      - SPRING_DATASOURCE_URL=${SPRINGBOOT_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRINGBOOT_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRINGBOOT_DATASOURCE_PASSWORD}
      - OTEL_SERVICE_NAME=${SPRINGBOOT_OTEL_SERVICE_NAME}
      - OTEL_TRACES_EXPORTER=${SPRINGBOOT_OTEL_TRACES_EXPORTER}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${SPRINGBOOT_OTEL_EXPORTER_ENDPOINT}
      - OTEL_METRICS_EXPORTER=${SPRINGBOOT_OTEL_METRICS_EXPORTER}
      - OTEL_LOGS_EXPORTER=${SPRINGBOOT_OTEL_LOGS_EXPORTER}
    depends_on:
      - alloydb-omni
      - tempo
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.springboot.rule=PathPrefix(`/api`)"
      - "traefik.http.services.springboot.loadbalancer.server.port=8080"

  nextjs-app:
    build:
      context: ../../node/procureiq-nextjs
      dockerfile: ../../deployment/docker/Dockerfile.nextjs
    container_name: procureiq-nextjs-app
    environment:
      - NEXT_PUBLIC_API_URL=${NEXTJS_API_URL}
      - DATABASE_URL=${NEXTJS_DATABASE_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${NEXTJS_OTEL_ENDPOINT}
    depends_on:
      - alloydb-omni
      - tempo
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextjs.rule=PathPrefix(`/`)"
      - "traefik.http.services.nextjs.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v2.10
    container_name: procureiq-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:${TRAEFIK_WEB_PORT}"
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
    ports:
      - "${TRAEFIK_WEB_PORT}:80"
      - "${TRAEFIK_DASHBOARD_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik:/etc/traefik
    restart: always

volumes:
  alloydb_data:
    driver: local
