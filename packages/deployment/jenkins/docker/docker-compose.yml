services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procureiq-jenkins
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    restart: always

volumes:
  jenkins_data:
    driver: local
