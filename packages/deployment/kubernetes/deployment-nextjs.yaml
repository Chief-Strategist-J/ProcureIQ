apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-app
  labels:
    app: nextjs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nextjs-app
  template:
    metadata:
      labels:
        app: nextjs-app
    spec:
      containers:
        - name: nextjs-app
          image: procureiq-nextjs-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://springboot-app-service:8080/api/v1
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@alloydb-omni-service:5432/procureiq
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo-service:4318/v1/traces
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-app-service
spec:
  type: ClusterIP
  selector:
    app: nextjs-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
