kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: procureiq-local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
      - containerPort: 30080
        hostPort: 8880
        protocol: TCP
  - role: worker
