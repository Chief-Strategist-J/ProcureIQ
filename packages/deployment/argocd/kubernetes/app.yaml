apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: procureiq
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Chief-Strategist-J/ProcureIQ.git
    targetRevision: main
    path: packages/deployment/kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
