worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream host_app {
        server host-app:8990;
    }
    upstream mfe_crypto {
        server mfe-crypto:8991;
    }
    upstream mfe_auth {
        server mfe-auth:8992;
    }
    upstream mfe_notifications {
        server mfe-notifications:8993;
    }
    upstream mfe_email {
        server mfe-email:8994;
    }
    upstream mfe_campaigns {
        server mfe-campaigns:8995;
    }
    upstream mfe_fieldservice {
        server mfe-fieldservice:8996;
    }
    upstream mfe_github {
        server mfe-github:8997;
    }
    upstream mfe_jobs {
        server mfe-jobs:8998;
    }
    upstream springboot_backend {
        server springboot-app:8080;
    }
    upstream python_backend {
        server python-app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/v1/auth/ {
            proxy_pass http://springboot_backend/api/v1/auth/;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /api/v1/python/ {
            proxy_pass http://python_backend/;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /auth {
            proxy_pass http://mfe_auth/auth;
        }

        location /crypto {
            proxy_pass http://mfe_crypto/crypto;
        }

        location /notifications {
            proxy_pass http://mfe_notifications/notifications;
        }

        location /email {
            proxy_pass http://mfe_email/email;
        }

        location /campaigns {
            proxy_pass http://mfe_campaigns/campaigns;
        }

        location /fieldservice {
            proxy_pass http://mfe_fieldservice/fieldservice;
        }

        location /github {
            proxy_pass http://mfe_github/github;
        }

        location /jobs {
            proxy_pass http://mfe_jobs/jobs;
        }

        location / {
            proxy_pass http://host_app;
        }
    }
}
